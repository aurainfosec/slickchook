name = "amass"
container = "caffix/amass:latest"
description = "Performs bounded passive asset and DNS enumeration for one authorized domain."
fixed_args = ["enum", "-passive", "-norecursive"]

[[options]]
name = "target"
description = "Authorized root domain."
required = true
flag = "-d"

[docker]
network = "bridge"
memory = "1g"
cpus = "1"
pids_limit = 128
timeout_seconds = 900
tmpfs = ["/tmp:rw,noexec,nosuid,nodev,size=64m", "/.config:rw,noexec,nosuid,nodev,size=32m,mode=1777"]

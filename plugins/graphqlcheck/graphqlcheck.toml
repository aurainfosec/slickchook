name = "graphqlcheck"
container = "slickchook-plugin/graphqlcheck:local"
description = "Runs bounded GraphQL endpoint and introspection checks against one authorized URL."
fixed_args = ["--url"]

[[arguments]]
name = "target"
description = "Authorized GraphQL endpoint URL."
required = true
position = 1

[docker]
network = "bridge"
memory = "384m"
cpus = "1"
pids_limit = 96
timeout_seconds = 180
tmpfs = ["/tmp:rw,noexec,nosuid,nodev,size=32m"]

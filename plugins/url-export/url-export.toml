name = "url-export"
container = "slickchook-plugin/url-export:local"
description = "Extracts, normalizes, and deduplicates URLs/domains/paths out of an arbitrary blob of already-gathered recon text into one clean, plain-text URL list at /artifacts/urls.txt (also written as a JSON array to /artifacts/urls.json) - a portable export for feeding discovered targets into another tool. Burp Suite's own Target > Scope > Advanced scope control > Load button imports a file in exactly this one-URL-per-line format directly into its scope (confirmed against PortSwigger's own docs, not assumed) - see RUNNER.md for that, the distinction between scope and Site Map population, and the Site-Map-specific option. text is the raw content to extract from - paste in whatever was already gathered across this engagement (concatenate multiple read_artifact calls' worth of output if needed), in whatever format it's actually in: a plain URL list, a JSON array, mixed free text - this plugin doesn't know or try to parse any particular plugin's own output shape, it just finds and cleans up anything URL-shaped in the text given to it. default_scheme additionally treats any line that's just a bare hostname (no scheme, e.g. from a subdomain-enumeration-only source) as a URL using that scheme - leave unset to only extract things that already look like a full URL. include_only_domain (comma-separated) keeps the exported list properly scoped to the named engagement by dropping anything whose host isn't the given domain(s) or a subdomain of one - use this to filter out incidental out-of-scope URLs that can show up in raw tool output (e.g. a citation/reference link in a search result), matching this fleet's own scope-discipline expectations for anything leaving a run. Pure local text processing, no network activity of its own. Very large pasted blobs may hit OS command-argument length limits - if that happens, split the input across multiple calls and run the resulting urls.txt files back through this same plugin once more (concatenated) for a final combined dedupe pass."
fixed_args = []

[[options]]
name = "text"
description = "Raw text to extract URLs/domains from - paste in already-gathered recon output, any format."
required = true
flag = "--text"

[[options]]
name = "default_scheme"
description = "Scheme to assume for bare hostname-only lines with no scheme (e.g. 'https'). Leave unset to only extract things that already look like a full URL."
required = false
flag = "--default-scheme"

[[options]]
name = "include_only_domain"
description = "Comma-separated domain(s) to keep - drops any extracted URL whose host isn't one of these or a subdomain of one. Leave unset to keep everything found."
required = false
flag = "--include-only-domain"

[docker]
network = "none"
memory = "128m"
cpus = "0.5"
pids_limit = 16
timeout_seconds = 30
tmpfs = ["/tmp:rw,noexec,nosuid,nodev,size=16m"]

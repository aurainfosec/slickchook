name = "sublert"
container = "slickchook-plugin/sublert:local"
description = "Monitors certificate-transparency-derived subdomains for one authorized domain."
fixed_args = []

[[arguments]]
name = "target"
description = "Authorized root domain."
required = true
position = 1

[docker]
network = "bridge"
memory = "512m"
cpus = "1"
pids_limit = 128
timeout_seconds = 600
tmpfs = ["/tmp:rw,noexec,nosuid,nodev,size=64m"]

name = "trufflehog"
container = "trufflesecurity/trufflehog:latest"
description = "Scans one explicitly authorized public repository or filesystem target for exposed secrets."
fixed_args = ["filesystem", "--no-update", "--json"]

[[options]]
name = "target"
description = "Authorized local path or repository URL."
required = true

[[options]]
name = "only_verified"
description = "Report only secrets TruffleHog actively confirmed are still live against their issuing service, dropping unverified regex matches. Sharply reduces false positives; recommended for most runs unless you specifically want the raw unverified matches too."
required = false
flag = "--only-verified"

[[options]]
name = "concurrency"
description = "Concurrent worker goroutines. Higher scans a large target faster; lower is gentler on a resource-constrained target. Omit to use TruffleHog's own default."
required = false
flag = "--concurrency"

[docker]
network = "none"
memory = "1g"
cpus = "1"
pids_limit = 128
timeout_seconds = 900
tmpfs = ["/tmp:rw,noexec,nosuid,nodev,size=128m"]

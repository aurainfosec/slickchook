name = "kiterunner"
container = "slickchook-plugin/kiterunner:local"
description = "Discovers API routes using the bounded Kiterunner small route corpus. concurrency and jobs are tunable: lower both for a fragile target or quieter footprint, raise them for faster coverage of a large authorized scope."
fixed_args = ["scan", "-w", "/opt/kiterunner/routes-small.kite", "-o", "json"]

[[assets]]
dest = "/opt/kiterunner/routes-small.kite"
min_size_bytes = 1024
description = "Small Kiterunner API route corpus downloaded at build time (no local source file to check — the Dockerfile fetches it from assetnote.io)."

[[options]]
name = "concurrency"
description = "Concurrent connections per target host. Default 5."
required = false
flag = "-x"
default = 5

[[options]]
name = "jobs"
description = "Parallel route-discovery jobs. Default 10."
required = false
flag = "-j"
default = 10

[[arguments]]
name = "target"
description = "One authorized HTTP or HTTPS API target."
required = true
position = 1

[docker]
network = "bridge"
memory = "512m"
cpus = "1"
pids_limit = 128
timeout_seconds = 300
tmpfs = ["/tmp:rw,noexec,nosuid,nodev,size=32m", "/.cache:rw,noexec,nosuid,nodev,size=16m"]

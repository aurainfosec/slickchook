name = "wpscan"
container = "slickchook-plugin/wpscan:local"
description = "Runs WPScan against one authorized WordPress site to enumerate every detected plugin/theme, flagging which ones WPScan's vulnerability database knows are vulnerable. Requires WPSCAN_API_TOKEN configured via [[secrets]] (see RUNNER.md's \"Configuring plugin API keys and secrets\") for that vulnerability data - without a valid token, WPScan still enumerates but reports no CVE data at all, so a run without one configured is close to useless. Each run is a fresh, ephemeral container with no persisted state, so WPScan updates its own plugin/theme fingerprint database over the network at the start of every single run (confirmed live: --no-update on a brand new container fails outright with \"database file is missing\", not just stale) - expect real network-dependent startup time on top of the scan itself; baking the database into the image at build time instead is a possible future optimization, not yet attempted. enumerate defaults to ap,at (all detected plugins/themes, each still flagged if WPScan's DB knows it's vulnerable) rather than vp,vt (vulnerable-only) - the full enumerated list is deliberately kept even for items WPScan doesn't flag, since its vulnerability database can lag behind a real CVE, especially for less widely used open-source plugins/themes; review the full list from the artifact, not just what got flagged. ap/at mode brute-forces WPScan's entire known plugin/theme slug list against the target rather than only what's actually detected, so it is inherently request-heavy - confirmed live: at WPScan's own default of 5 threads, a full ap,at run against a real site with a non-trivial plugin/theme footprint exceeded even a 2700-second (45 minute) timeout without finishing. max_threads raises concurrency (default here: 10, double WPScan's own default of 5) to give a full enumeration a realistic chance of finishing in time; raise further for large sites, or narrow enumerate to vp,vt for a faster vulnerability-only pass instead. stealthy, random_user_agent and throttle trade speed for a smaller footprint - note throttle forces WPScan's own max-threads down to 1 internally, silently overriding whatever max_threads is set to, so don't combine throttle with a high max_threads expecting both. force skips WPScan's own check for whether the target looks like WordPress - use only once fingerprinting (e.g. httpx's tech_detect) has already confirmed it. Flags verified against this image's real `wpscan --help` output (v4.1.0) - the fuller `--hh` output has not been checked."
fixed_args = ["--format", "json"]

[[secrets]]
env_var = "WPSCAN_API_TOKEN"
description = "WPScan vulnerability database API token (from wpscan.com/register). Without it, WPScan still enumerates but cannot report which findings are actually vulnerable."
required = true

[[options]]
name = "target"
description = "Authorized WordPress site URL."
required = true
flag = "--url"

[[options]]
name = "enumerate"
description = "Comma-separated enumeration categories: vp (vulnerable plugins), vt (vulnerable themes), u (users), ap (all plugins), at (all themes), cb (config backups), dbe (db exports), m (media). Default ap,at enumerates every detected plugin/theme (not just ones already flagged vulnerable) so the full list can be reviewed manually too; narrow to vp,vt for a faster vulnerability-only pass, or add u for user enumeration."
required = false
flag = "--enumerate"
default = "ap,at"

[[options]]
name = "stealthy"
description = "WPScan's own built-in low-footprint preset: random user-agent, reduced request rate, skips the more detectable checks."
required = false
flag = "--stealthy"

[[options]]
name = "random_user_agent"
description = "Use a random user-agent per request, without WPScan's full stealthy preset."
required = false
flag = "--random-user-agent"

[[options]]
name = "max_threads"
description = "Concurrent request threads for enumeration. WPScan's own default is 5, which can be too slow to finish a full ap,at enumeration within the container timeout on a real site - default here is 10. Raise further for large sites/faster runs at the cost of a heavier footprint; has no effect if throttle is also set, since throttle forces WPScan's internal max-threads to 1."
required = false
flag = "--max-threads"
default = "10"

[[options]]
name = "throttle"
description = "Milliseconds to wait before each request. Raise for a quieter, slower scan. Forces WPScan's own max-threads to 1 internally, overriding max_threads - the two options are mutually exclusive in effect even though both can be set."
required = false
flag = "--throttle"

[[options]]
name = "force"
description = "Skip WPScan's own check for whether the target actually looks like WordPress."
required = false
flag = "--force"

[docker]
network = "bridge"
memory = "1g"
cpus = "1"
pids_limit = 128
timeout_seconds = 2700
tmpfs = ["/tmp:rw,noexec,nosuid,nodev,size=512m"]

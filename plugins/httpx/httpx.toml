name = "httpx"
container = "projectdiscovery/httpx:v1.9.0"
description = "Runs the ProjectDiscovery HTTPX web probe (not the Python library) against one authorized target. tech_detect fingerprints the stack (Wappalyzer dataset) - use its result to steer follow-up plugin choices (e.g. feroxbuster's wordlist, whether graphqlcheck applies) rather than always taking generic defaults. httpx already randomizes its user-agent per request by default; threads/timeout/delay/rate_limit tune speed against footprint."
fixed_args = ["-silent", "-disable-update-check"]

[[options]]
name = "target"
description = "Authorized URL, hostname, or IP address to probe."
required = true
flag = "-target"

[[options]]
name = "status_code"
description = "Include the HTTP response status code."
required = false
flag = "-status-code"

[[options]]
name = "title"
description = "Include the HTML page title."
required = false
flag = "-title"

[[options]]
name = "tech_detect"
description = "Include detected web technologies."
required = false
flag = "-tech-detect"

[[options]]
name = "rate_limit"
description = "Maximum requests per second. Default 150."
required = false
flag = "-rate-limit"

[[options]]
name = "threads"
description = "Concurrent probing threads. Default 50; lower for a fragile target or quieter footprint."
required = false
flag = "-threads"

[[options]]
name = "timeout"
description = "Per-request timeout in seconds. Default 10."
required = false
flag = "-timeout"

[[options]]
name = "delay"
description = "Pause between each request, e.g. 200ms or 1s. Unset (no delay) by default; add one for a quieter, slower probe."
required = false
flag = "-delay"

[[options]]
name = "follow_redirects"
description = "Follow HTTP redirects."
required = false
flag = "-follow-redirects"

[docker]
network = "bridge"
memory = "512m"
cpus = "1"
pids_limit = 128
timeout_seconds = 300
tmpfs = ["/tmp:rw,noexec,nosuid,nodev,size=64m"]

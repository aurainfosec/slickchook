name = "nmap"
container = "instrumentisto/nmap:7.98-r2"
description = "Runs bounded Nmap scans against one authorized target, including optional raw-packet checks, non-authenticated SSH NSE checks, and Nmap's own timing-template mechanism for trading speed against IDS/network evasion."
fixed_args = ["-sT"]

[[arguments]]
name = "target"
description = "Authorized hostname, IP address, or CIDR range to scan."
required = true
position = 1

[[options]]
name = "ports"
description = "Ports or ranges accepted by Nmap, for example 22,80,443 or 1-1024."
required = false
flag = "-p"

[[options]]
name = "service_detection"
description = "Probe open ports to identify services and versions."
required = false
flag = "-sV"

[[options]]
name = "timing_template"
description = "Nmap timing template, 0-5. 0 (paranoid) and 1 (sneaky) space probes out for IDS/network evasion at real cost to speed; 4 (aggressive) and 5 (insane) are fast and noisy. Omit to use Nmap's own default (3, normal)."
required = false
flag = "-T"

[[options]]
name = "ssh_checks"
description = "Run non-authenticated SSH algorithm and authentication-method enumeration scripts."
required = false
flag = "--script"
default = "ssh2-enum-algos,ssh-auth-methods"

[docker]
network = "bridge"
memory = "512m"
cpus = "1"
pids_limit = 128
timeout_seconds = 600
cap_add = ["NET_RAW"]

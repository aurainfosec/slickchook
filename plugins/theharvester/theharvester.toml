name = "theharvester"
container = "slickchook-plugin/theharvester:local"
description = "Aggregates emails, subdomains, names, IPs, and URLs for an authorized domain from many passive sources at once, via theHarvester (github.com/laramies/theHarvester, actively maintained - real commits the same day this was written, pinned to the real latest release 4.11.1 since its own PyPI package is drastically stale at 0.0.1). Always writes both a JSON and an XML export under /artifacts (via a fixed, non-overridable -f flag) in addition to the usual stdout/stderr capture, so results are reliably retrievable afterward, not just visible in console output. Most sources are free/keyless (certspotter, chaos, commoncrawl, crtsh, duckduckgo, gitlab, otx, rapiddns, robtex, subdomaincenter, threatcrowd, urlscan, waybackarchive, yahoo, shodanInternetDB, hudsonrock, baidu, bufferoverun, dnsdumpster, mojeek, netlas, onyphe, and more) and work with no configuration at all. Many others need an API key, read only from theHarvester's own local config file - it has no environment-variable support of its own at all (confirmed directly from its source) - so this plugin's entrypoint writes that file from whichever of the secrets below are actually configured, before every run. Where an already-installed plugin already covers the same underlying provider, this reuses that exact same secret rather than declaring a redundant one: SHODAN_API_KEY (shodan-host/shodan-search), VT_API_KEY (virustotal-resolutions), GH_TOKEN (github-code-search), BRAVE_API_KEY (brave-dork-search), DEHASHED_API_KEY (dehashed) - configuring any of those once already makes them available here too, no separate configuration needed. Every other key-requiring source gets its own THEHARVESTER_*-prefixed secret below, since no other installed plugin covers that provider; every one of them is optional - theHarvester works fine on its free sources alone, and missing-key warnings for the rest are suppressed. source selects which of these to actually query (comma-separated, or 'all') - narrowing it to only sources you have keys for (or only the free ones) avoids wasted requests to sources that will just report a missing key. shodan additionally queries Shodan for each discovered host specifically (distinct from shodan just being one of the listed sources above) - needs SHODAN_API_KEY. take_over checks discovered subdomains for a subdomain-takeover condition. dns_resolve/dns_lookup/dns_brute control additional DNS-side enrichment of discovered hosts. Screenshotting and wordlist-based API-endpoint scanning (theHarvester's own --screenshot/-w/-a flags) are deliberately not exposed - the former overlaps this fleet's own gowitness/screensanitize pairing and needs a real browser, the latter needs an arbitrary wordlist file this schema has no way to supply per call."
fixed_args = ["-f", "/artifacts/results", "-q"]

[[options]]
name = "domain"
description = "Authorized domain to search for."
required = true
flag = "-d"

[[options]]
name = "source"
description = "Comma-separated source name(s) to query, or 'all'. See this plugin's own description for the full free/keyless list, and check which secrets are configured below for the rest."
required = false
flag = "-b"
default = "all"

[[options]]
name = "limit"
description = "Maximum results to return per source. Omit for theHarvester's own default (500)."
required = false
flag = "-l"

[[options]]
name = "start"
description = "Result offset to start at, for paging through a source with more results than limit."
required = false
flag = "-S"

[[options]]
name = "shodan"
description = "Additionally query Shodan for each discovered host specifically (distinct from shodan being one of the queryable sources) - needs SHODAN_API_KEY configured."
required = false
flag = "-s"

[[options]]
name = "dns_server"
description = "DNS server to use for resolution/brute-forcing."
required = false
flag = "-e"

[[options]]
name = "take_over"
description = "Check discovered subdomains for a subdomain-takeover condition."
required = false
flag = "-t"

[[options]]
name = "dns_resolve"
description = "Resolve discovered hosts using theHarvester's own default resolver list."
required = false
flag = "-r"

[[options]]
name = "dns_lookup"
description = "Perform basic DNS lookups (A/AAAA/etc) against discovered hosts."
required = false
flag = "-n"

[[options]]
name = "dns_brute"
description = "Brute-force subdomains via DNS using theHarvester's own bundled wordlist."
required = false
flag = "-c"

[[secrets]]
env_var = "SHODAN_API_KEY"
description = "Shodan API key - shared with shodan-host/shodan-search if already configured there."
required = false

[[secrets]]
env_var = "VT_API_KEY"
description = "VirusTotal API key - shared with virustotal-resolutions if already configured there."
required = false

[[secrets]]
env_var = "GH_TOKEN"
description = "GitHub personal access token - shared with github-code-search if already configured there."
required = false

[[secrets]]
env_var = "BRAVE_API_KEY"
description = "Brave Search API key - shared with brave-dork-search if already configured there."
required = false

[[secrets]]
env_var = "DEHASHED_API_KEY"
description = "Dehashed API key - shared with the dehashed plugin if already configured there."
required = false

[[secrets]]
env_var = "THEHARVESTER_BEVIGIL_KEY"
description = "BeVigil API key, for the bevigil source."

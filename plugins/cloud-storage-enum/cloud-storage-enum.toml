name = "cloud-storage-enum"
container = "slickchook-plugin/cloud-storage-enum:local"
description = "Checks for AWS S3 buckets, Google Cloud Storage buckets, and Azure Blob Storage containers that might belong to an authorized organization, from a keyword (e.g. its brand name), and reports whether each candidate exists, is private, or is publicly accessible. Storage-only scope, deliberately: wraps individual functions from cloud_enum (github.com/initstring/cloud_enum, MIT), pinned to an exact commit rather than a tag or PyPI release (both are stale relative to the real current source, confirmed live) - but only its check_s3_buckets/check_gcp_buckets/check_storage_accounts/brute_force_containers functions are called directly, not its full CLI, which also probes several unrelated non-storage services (Firebase RTDB, App Engine, Cloud Functions, AWS Apps, Azure VMs/websites/databases/Key Vault) with no way to scope those out. Real, confirmed signals differ meaningfully by provider - don't assume parity: S3 and GCS both give a clean three-state signal (404 doesn't exist, 403 exists but not listable, 200 exists and is publicly listable) - confirmed live against real buckets, including the important nuance that a 403 only means 'not listable', not necessarily fully private (a real, well-known public-data bucket returned 403 here despite serving individual objects publicly - S3/GCS separate object-read permission from bucket-list permission). Azure is messier and has no equivalently clean 'exists but private' signal for containers specifically (confirmed from the wrapped library's own real response-handling logic) - a missing Azure result here is a real limitation of what's actually detectable this way, not necessarily an absence of a real container. Azure storage account names are globally unique (existence is a DNS question); Azure container names are only unique within an account, so containers are only checked within accounts already confirmed to exist. keyword accepts one or more comma-separated base terms - each gets combined with cloud_enum's own real, bundled mutation wordlist (306 entries: years, common suffixes like 'backup'/'assets'/'logs', etc. - not invented for this plugin) as prefix and suffix combinations, producing roughly 1800 candidate names per keyword by default; quickscan skips all mutations and checks only the bare keyword(s), for a fast initial sanity check before committing to the full default run. S3's real rate-limit signal ('Slow Down') is already respected by the wrapped library itself, breaking out of that provider's check early rather than continuing to hammer a throttled endpoint - raise threads deliberately, not reflexively, since a higher value increases how fast that throttling gets triggered. Structured findings are written to /artifacts/findings.jsonl (one JSON object per hit, with platform/msg/target/access fields) - but the full file listing for any publicly-listable bucket/container found is only available in the plugin's own stdout/stderr output, not the structured file, so check both."
fixed_args = []

[[options]]
name = "keyword"
description = "One or more comma-separated organization/brand keywords to check, e.g. 'acmecorp' or 'acmecorp,acme-inc'."
required = true
flag = "--keyword"

[[options]]
name = "quickscan"
description = "Skip all mutations and check only the bare keyword(s) - a fast initial sanity check before committing to the full ~1800-candidate default run."
required = false
flag = "--quickscan"

[[options]]
name = "threads"
description = "Concurrent HTTP/DNS workers. Higher finishes faster but increases how quickly S3's rate-limiting kicks in - raise deliberately, not reflexively."
required = false
flag = "--threads"

[[options]]
name = "nameserver"
description = "DNS server to use for Azure storage-account existence lookups."
required = false
flag = "--nameserver"

[[options]]
name = "disable_aws"
description = "Skip the AWS S3 bucket check."
required = false
flag = "--disable-aws"

[[options]]
name = "disable_gcp"
description = "Skip the Google Cloud Storage bucket check."
required = false
flag = "--disable-gcp"

[[options]]
name = "disable_azure"
description = "Skip the Azure Blob Storage container check."
required = false
flag = "--disable-azure"

[[assets]]
source = "fuzz.txt"
dest = "/opt/fuzz.txt"
min_size_bytes = 1000
description = "cloud_enum's own real bundled mutation/brute-force wordlist (306 entries), pinned to the same commit as the wrapped library - not something pip install bundles on its own, so fetched separately and committed here."

[docker]
network = "bridge"
memory = "256m"
cpus = "1"
pids_limit = 64
timeout_seconds = 1800
tmpfs = ["/tmp:rw,noexec,nosuid,nodev,size=32m"]

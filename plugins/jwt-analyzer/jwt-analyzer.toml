name = "jwt-analyzer"
container = "slickchook-plugin/jwt-analyzer:local"
description = """
Decodes a JWT's header/claims and offline-tests it for common weaknesses, via jwt_tool (github.com/ticarpi/jwt_tool) - closes the loop where several other installed plugins already flag "found a JWT-looking string" as a raw regex match but nothing decodes or analyzes it. Not actively maintained (last real commit/release v2.3.0, 2025-05-01) but still the standard, most-referenced tool for this with no better-maintained alternative found - built from source and pinned to that exact release tag, since no PyPI package exists for it at all.

OFFLINE BY DESIGN: confirmed directly from its own source that only its -t/targeturl and -ju/jwksurl flags trigger any network call at all - neither is exposed here, so network is set to none and this plugin can never reach a live target regardless of input. This plugin only ever produces output (decoded claims, a crafted "attack" token, a cracked secret) - it never submits anything to a live service itself. Only actually use a crafted token against a real target under the same authorization this fleet already requires for any live/active testing (see §0 in SKILL.md) - as a separate, deliberate follow-up call, not automatically.

BASIC USE: jwt is the raw token to analyze - with no other options, this just decodes and prints its header/claims.

EXPLOIT crafts a specific tampered variant locally: a = alg:none (strips the signature entirely - only valid against an unpatched implementation that trusts alg:none), n = null signature, p = "psychic signature" (CVE-2022-21449, ECDSA), b = blank password accepted in signature, i = inject an inline, freshly-generated JWKS into the header. jwt_tool's key-confusion exploit (its own "k" choice) and its RSA/EC/PSS signing modes are deliberately not exposed here - confirmed directly from source that both actually require a real key *file already present on disk* (they call Python's open() on the given key argument, despite the tool's own --help text describing it as "key content") rather than accepting key material as a plain value, which this fleet's per-call options schema has no way to provide; likewise its JWKS-spoofing exploit ("s") needs a live JWKS URL, out of scope for an offline tool.

CRACK dictionary-attacks a HS256/384/512-signed token's secret using jwt_tool's own real bundled wordlist of common/weak JWT signing secrets by default, or tests one specific candidate directly via password.

SIGN re-signs a tampered token with a known or cracked HMAC secret (password) - only hs256/hs384/hs512 are exposed, for the same file-path reason the rs*/es*/ps* choices and key-confusion exploit are excluded above.

jwt_tool's general interactive tamper/claim-injection modes are deliberately not exposed either - confirmed from source they're built entirely around live input() prompts, which would just fail in this fleet's non-interactive containers; the exploit/crack/sign flags above cover the same ground non-interactively. Also confirmed live: jwt_tool's own -b/--bare flag suppresses nearly all of its output, not just its banner as the help text implies - including the decoded-claims printout itself, since virtually everything routes through a helper that -b disables outright - so it is deliberately never passed here.\
"""
fixed_args = ["-d", "/opt/jwt_tool/jwt-common.txt"]

[[arguments]]
name = "jwt"
description = "The raw JWT to decode/analyze."
required = true
position = 1

[[options]]
name = "exploit"
description = "Craft a specific tampered token variant: a (alg:none), n (null signature), p (psychic signature, CVE-2022-21449), b (blank password accepted), or i (inject a freshly-generated inline JWKS)."
required = false
flag = "-X"

[[options]]
name = "crack"
description = "Dictionary-attack this token's HMAC secret using jwt_tool's own bundled wordlist of common/weak JWT signing secrets - or use password to test one specific candidate instead."
required = false
flag = "-C"

[[options]]
name = "password"
description = "A single specific secret to test - either as the one candidate for crack (instead of the bundled wordlist), or as the HMAC secret when re-signing with sign."
required = false
flag = "-p"

[[options]]
name = "sign"
description = "Re-sign a tampered token with a known/cracked HMAC secret (given via password): hs256, hs384, or hs512."
required = false
flag = "-S"

[docker]
network = "none"
memory = "128m"
cpus = "0.5"
pids_limit = 32
timeout_seconds = 120
tmpfs = ["/tmp:rw,noexec,nosuid,nodev,size=16m"]

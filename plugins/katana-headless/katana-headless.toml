name = "katana-headless"
container = "slickchook-plugin/katana-headless:local"
description = "Runs ProjectDiscovery Katana against one authorized URL with its real headless (Chromium-based) crawling engine enabled - a complement to the plain katana plugin, which is scoped to non-headless HTTP crawling only. This is genuinely different functionality, not just a slower version of the same thing: a real browser executes each page's JavaScript, so this discovers endpoints and content that only exist after client-side rendering (a JS-rendered SPA's routes, for example) and, with xhr_extraction, captures the actual dynamic XHR/fetch calls a page makes at runtime - dynamic behavior neither the plain katana plugin nor gowitness's screenshot capture can see. Built from the same official projectdiscovery/katana:v1.7.0 image as the plain katana plugin (confirmed live it bundles a real Chromium via Alpine's own apk package, not something this plugin installs itself) with the same $HOME fix. -no-sandbox maps directly to Chrome's own --no-sandbox flag and is always set in fixed_args alongside -headless itself, since Chrome's internal sandbox otherwise needs privileges to set up its own process isolation. Confirmed live, the hard way, that this alone isn't enough: this fleet's usual unprivileged run-as-user (UID 65534, no matching /etc/passwd entry) produces a genuinely silent failure here - exit code 0, zero output on stdout or stderr, even with verbose logging enabled - regardless of capabilities, no-new-privileges, or a read-only root filesystem (each tested in isolation via direct docker run, bisecting one restriction at a time). Running the exact same invocation as root produced a full, real crawl immediately. This isolates the cause specifically to the unprivileged UID itself (or the lack of a matching /etc/passwd entry for it), not any capability or filesystem restriction - so run_as_root=true is set here as a deliberate, scoped exception, the same kind nmap's own manifest already documents for a different underlying reason (nmap's raw-packet techniques need literal EUID 0; here it's Chrome/Chromium's own apparent need for a real, resolvable user identity to initialize successfully). Pointing pure headless mode at the already-installed system Chromium needed a real live-tested fix, not just a source read: -system-chrome (an auto-detecting flag) turned out to only be honored by Katana's separate hybrid engine (pkg/engine/hybrid) - confirmed live that pure headless mode (pkg/engine/headless/browser, a genuinely different code path) silently ignores it and falls straight through to go-rod's own default behavior, auto-downloading a fresh Chromium build from Google's CDN on every single run regardless. Fixed by using -system-chrome-path with an explicit path to the real Alpine-packaged binary (/usr/bin/chromium, confirmed against Alpine 3.24's own chromium package file listing) instead, which pure headless mode's code does correctly honor. Katana's own source additionally errors outright if -no-sandbox or -system-chrome-path are set without headless or hybrid mode also enabled - since headless mode itself is unconditionally set in fixed_args here too, this can never occur through this plugin. automatic_form_fill is deliberately not exposed here: confirmed from katana's own source comment that it is explicitly disabled/ignored for headless navigation upstream (\"incorrect implementation... should be handled via headless actions within the page context\") - a real, confirmed upstream limitation, not an oversight. auto_login performs a real, live authenticated action against the target using the given credentials - the same test-only, retained-in-run-history caution this fleet's medusa plugin already documents applies here too. This plugin's docker policy also sizes /dev/shm well above Docker's small 64 MiB default - a well-known real crash cause for headless Chrome, which uses shared memory heavily between renderer processes - since this plugin doesn't expose katana's raw headless-options passthrough for a --disable-dev-shm-usage-style workaround instead."
fixed_args = ["-silent", "-disable-update-check", "-no-color", "-headless", "-system-chrome-path", "/usr/bin/chromium", "-no-sandbox"]

[[options]]
name = "target"
description = "Authorized URL to crawl."
required = true
flag = "-u"

[[options]]
name = "xhr_extraction"
description = "Capture XHR/fetch request URLs and methods made dynamically by the page's own JavaScript at runtime - only visible when json_output is also enabled. The main reason to reach for headless mode over the plain katana plugin: this is real dynamic runtime behavior, not something a non-headless crawler or a screenshot can see."
required = false
flag = "-xhr-extraction"

[[options]]
name = "auto_login"
description = "Automatic login with username:password before crawling (headless only). This is a real, live authenticated action against the target, not passive crawling - the same test-only-credential, retained-in-run-history caution this fleet's medusa plugin already documents applies here too. Only use with credentials you're authorized to use against this specific target."
required = false
flag = "-auto-login"

[[options]]
name = "depth"
description = "Maximum crawl depth. Omit for Katana's own default (3)."
required = false
flag = "-depth"

[[options]]
name = "js_crawl"
description = "Also parse and follow endpoints found inside static JavaScript file text, in addition to the dynamic rendering headless mode already does."
required = false
flag = "-js-crawl"

[[options]]
name = "crawl_duration"
description = "Maximum wall-clock time to crawl for, e.g. 5m - a self-imposed cap independent of this plugin's own container timeout_seconds, useful for bounding a crawl of unknown size predictably. Headless crawling is meaningfully slower per page than non-headless crawling (a real browser has to actually render each page), so budget accordingly."
required = false
flag = "-crawl-duration"

[[options]]
name = "max_response_size"
description = "Maximum response size in bytes to read per page. Omit for Katana's own default (4194304, 4 MiB)."
required = false
flag = "-max-response-size"

[[options]]
name = "timeout_seconds"
description = "Per-request timeout in seconds. Omit for Katana's own default (10) - headless pages may need a higher value to allow for real rendering time."
required = false
flag = "-timeout"

[[options]]
name = "retries"
description = "Number of times to retry a failed request. Omit for Katana's own default (1)."
required = false
flag = "-retry"

[[options]]
name = "form_extraction"
description = "Extract form/input/textarea/select elements into the output - only visible when json_output is also enabled. Useful for mapping input surfaces worth testing later, without submitting anything."
required = false
flag = "-form-extraction"

[[options]]
name = "tech_detect"
description = "Enable technology detection during crawling, matching the same tech_detect naming used by this fleet's httpx plugin."
required = false
flag = "-tech-detect"

[[options]]
name = "headers"
description = "Custom header/cookie to include on every request, header:value format. Useful for authenticated crawling with a session cookie already obtained through proper means."
required = false
flag = "-headers"

[[options]]
name = "knowledge_base"
description = "Enable Katana's knowledge-base classification of crawled content - only visible when json_output is also enabled."
required = false
flag = "-knowledge-base"

[[options]]
name = "kb_secrets"
description = "Extract likely secrets (API keys, tokens, etc.) found while crawling into the knowledge base - including in dynamically-rendered content and captured XHR responses that a non-headless crawl would miss. Passive - only reports what's already exposed, doesn't validate anything (see kb_validate_secrets for that separate, active step)."
required = false
flag = "-kb-secrets"

[[options]]
name = "kb_validate_secrets"
description = "Validate each detected secret against its own provider's real API to check whether it's actually live. This sends real network requests to third-party services (AWS, GitHub, Slack, etc. depending on the secret type) - a genuine active side effect, not passive analysis. Only enable with the same deliberateness as any other live action against real infrastructure."
required = false
flag = "-kb-validate-secrets"

[[options]]
name = "kb_endpoints"
description = "Classify crawled endpoints by type (REST/GraphQL/SOAP/XHR) in the knowledge base - only visible when json_output is also enabled."
required = false
flag = "-kb-endpoints"

[[options]]
name = "max_domain_pages"
description = "Maximum number of pages to crawl per domain - a real bound on crawl size. Omit for Katana's own default (unlimited), which on a large site could run long, especially at headless mode's slower per-page cost; set this for a predictable, scoped crawl."
required = false
flag = "-max-domain-pages"

[[options]]
name = "crawl_scope"
description = "Regex (or list) of in-scope URLs the crawler is allowed to follow, in addition to Katana's own default host-based scoping."
required = false
flag = "-crawl-scope"

[[options]]
name = "crawl_out_scope"
description = "Regex (or list) of URLs to explicitly exclude from crawling."
required = false
flag = "-crawl-out-scope"

[[options]]
name = "field_scope"
description = "Scope field: dn (domain name), rdn (root domain name, Katana's own default), fqdn, or a custom regex. rdn is usually the right, safe default - it keeps the crawl within the authorized domain."
required = false
flag = "-field-scope"

[[options]]
name = "no_scope"
description = "Disable Katana's own host-based default scope entirely, letting the crawler follow links off the authorized domain. Leave off unless the engagement specifically calls for it - this is the one option here that can take a crawl outside what was actually authorized."
required = false
flag = "-no-scope"

[[options]]
name = "match_regex"
description = "Only output URLs matching this regex (or list)."
required = false
flag = "-match-regex"

[[options]]
name = "filter_regex"
description = "Exclude URLs matching this regex (or list) from output."
required = false
flag = "-filter-regex"

[[options]]
name = "concurrency"
description = "Number of concurrent fetchers. Omit for Katana's own default (10) - each one is a real browser tab/page under headless mode, meaningfully more resource-intensive per unit than non-headless concurrency; consider lowering for a memory-constrained run."
required = false
flag = "-concurrency"

[[options]]
name = "delay"
description = "Delay between requests, in seconds - raise for a quieter, slower crawl."
required = false
flag = "-delay"

[[options]]
name = "rate_limit"
description = "Maximum requests per second overall. Omit for Katana's own default (150) - high for a stealthy crawl; lower for a small or fragile authorized target, and consider that headless rendering is already naturally much slower per page regardless of this setting."
required = false
flag = "-rate-limit"

[[options]]
name = "json_output"
description = "Emit newline-delimited JSON instead of a plain URL list - required to see xhr_extraction, form_extraction, knowledge_base, kb_secrets, and kb_endpoints data at all."
required = false
flag = "-jsonl"

[[options]]
name = "store_response"
description = "Store each crawled request/response pair as separate artifact files, not just the URL list - useful for reviewing what a page actually returned, not just that it was found."
required = false
flag = "-store-response"

[[options]]
name = "verbose"
description = "Show Katana's own verbose logging."
required = false
flag = "-verbose"

[docker]
network = "bridge"
run_as_root = true
memory = "1536m"
cpus = "2"
pids_limit = 512
timeout_seconds = 1200
# /dev/shm is a well-known real headless-Chrome-in-Docker crash cause at
# Docker's own small default size (64m) - Chrome uses it heavily for
# inter-process shared memory between renderer processes. Sized larger
# here rather than relying on a --disable-dev-shm-usage flag, since this
# plugin doesn't expose katana's raw -headless-options passthrough.
tmpfs = ["/tmp:rw,noexec,nosuid,nodev,size=256m", "/dev/shm:rw,noexec,nosuid,nodev,size=512m"]

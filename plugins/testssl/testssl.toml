name = "testssl"
container = "drwetter/testssl.sh:latest"
description = "Runs testssl.sh against a single TLS endpoint. Provide target as a hostname, IP address, URL, or host:port value. The MCP response includes a bounded stdout/stderr preview plus artifact paths. Full stdout, stderr, a pretty JSON report, and an HTML report are stored under the run artifact directory. vulnerable_only narrows the full ~900s battery to just the vulnerability checks; sneaky and ids_friendly are testssl's own built-in network-evasion options. Building a full TLS-configuration compliance report (a protocol-support table plus a weak-cipher-component table) needs TWO separate calls to this plugin, not one - confirmed directly from testssl.sh's own source (its count_do_variables/set_scanning_defaults dispatch logic) and from a real live scan: setting each_cipher or cipher_per_proto switches testssl into running ONLY that specific test, not the full default battery plus that extra detail - a live test with each_cipher set came back with protocols, vulnerabilities, serverDefaults, fs, serverPreferences, browserSimulations, rating, and grease ALL empty, only cipherTests populated. Call 1 (no each_cipher/cipher_per_proto set at all) for the protocol-support table: read result.json and look for entries with id SSLv2, SSLv3, TLS1 (this is TLS 1.0), TLS1_1, TLS1_2, TLS1_3 - each has a finding field of exactly 'offered' or 'not offered'. These six entries are produced by the default full battery whenever each_cipher/cipher_per_proto are both left unset (fast and vulnerable_only both skip them too - avoid those for this call). Render each row as a pass (tick) or fail (cross) mark per NIST SP 800-52 Rev. 2, which deprecates SSLv2/SSLv3/TLS 1.0/TLS 1.1 and treats TLS 1.2/TLS 1.3 as currently secure: for the deprecated rows (SSLv2, SSLv3, TLS1, TLS1_1) mark a cross when finding is 'offered' (the server still supports a deprecated protocol - a finding) and a tick when 'not offered' (correctly disabled); for the currently-secure rows (TLS1_2, TLS1_3) mark a tick when 'offered' and a cross when 'not offered' (the server lacks support for this secure protocol version). Call 2 (each_cipher or cipher_per_proto set) for the weak-cipher-component table: the default battery alone does not include a detailed per-cipher-suite listing - it only reports broad historical cipher-category buckets (NULL/EXPORT/LOW/3DES/etc.). With either option set, result.json instead gains one cipherTests entry per accepted cipher suite, id cipher_<hexcode>, whose finding is a single plain space-padded text line with NO Kx=/Enc=-style field prefixes (confirmed from a real scan's actual JSON output, e.g. 'x35     AES256-SHA                        RSA        AES         256      TLS_RSA_WITH_AES_256_CBC_SHA' and 'xc028   ECDHE-RSA-AES256-SHA384           ECDH 256   AES         256      TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA384'): hexcode, then the OpenSSL cipher name, then the key-exchange column (RSA, DH, EDH, or ECDH - testssl's own label for ephemeral/forward-secret Diffie-Hellman is EDH, not DHE - with the negotiated Diffie-Hellman bit-length appended directly after EDH/DH/ECDH only, e.g. 'EDH 1024' or 'ECDH 256'), then the encryption algorithm alone with no parentheses or bit count folded in (AESGCM, AES, 3DES, RC4, Camellia, ChaCha20, etc.), then the bit-strength as its own column, then the RFC-style name (e.g. TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA384) as the last column. Parse each row using these fields: an EDH key-exchange column with an appended bit-length under 3072 is the DHE (1024) or DHE (<3072) row depending on the exact number (call it DHE for the report even though testssl's own label is EDH); a plain RSA key-exchange column (no DH/EDH/ECDH prefix, i.e. static RSA key exchange, no forward secrecy) is the RSA row; an encryption column of RC4 is the RC4 row; 3DES or DES is the 3DES row; AES with a strength column of 128 is the AES-128 row (distinct from AES with strength 256, which these tables don't flag); Camellia is the Camellia row; ChaCha20 is the ChaCha20-Poly1305 row (flagged here for a specific compliance framework's own approved-algorithm list, not because it's cryptographically weak - don't editorialize that it's actually fine elsewhere). CBC mode and MD5/SHA1 MAC aren't given their own labeled column either - read them from the trailing RFC-style name instead, which spells them out directly: a name containing CBC (as opposed to GCM/CCM/POLY1305) is the CBC-mode row, and its own trailing _MD5/_SHA (SHA1) suffix names the MAC directly (_SHA256/_SHA384 suffixes are not SHA1 and shouldn't be flagged as such). cipher_per_proto additionally separates this listing by protocol version if that granularity is ever needed; each_cipher is the plain unified list and is usually sufficient. Either one meaningfully increases scan time (testing every locally-known cipher suite against the target, not just the default's own smaller battery) - only ask for it, as a separate call, when the actual weak-cipher-component table is needed, not as a default."
fixed_args = [
  "--warnings",
  "batch",
  "--color",
  "0",
  "--append",
  "--jsonfile-pretty",
  "/artifacts/result.json",
  "--htmlfile",
  "/artifacts/report.html",
]

[[arguments]]
name = "target"
description = "TLS endpoint to scan, for example example.com, example.com:443, https://example.com, or 192.0.2.10:443."
required = true
position = 1

[[options]]
name = "fast"
description = "Run a faster scan with fewer checks."
required = false
flag = "--fast"

[[options]]
name = "vulnerable_only"
description = "Run only the known-vulnerability checks (Heartbleed, ROBOT, POODLE, and similar), skipping the full protocol/cipher/config battery. Much faster when only vulnerability findings matter."
required = false
flag = "--vulnerable"

[[options]]
name = "sneaky"
description = "testssl's own built-in evasion option: leave less trace in the target's logs by using a generic user-agent and referer instead of testssl's own identifiable strings."
required = false
flag = "--sneaky"

[[options]]
name = "ids_friendly"
description = "Skip the small number of vulnerability checks most likely to trip an IDS into blocking the scanning IP."
required = false
flag = "--ids-friendly"

[[options]]
name = "user_agent"
description = "Set a custom user-agent instead of testssl's own default string."
required = false
flag = "--user-agent"

[[options]]
name = "each_cipher"
description = "Also test every locally-known cipher suite individually against the target, producing one detailed cipher_<hexcode> finding per accepted suite in result.json - needed to build a weak-cipher-component table (key exchange, encryption algorithm, mode, MAC). This SUPPRESSES the rest of the default battery (protocols, vulnerabilities, server defaults, etc. all come back empty) - run a separate plain call with this option unset to get the protocol-support table. See this plugin's own description for exactly how to parse these findings. Meaningfully increases scan time; only set this when that level of detail is actually needed."
required = false
flag = "--each-cipher"

[[options]]
name = "cipher_per_proto"
description = "Like each_cipher, but additionally separates the per-cipher-suite listing by protocol version. Also suppresses the rest of the default battery the same way each_cipher does - run a separate plain call with this option unset to get the protocol-support table. Use instead of each_cipher only if it matters which specific protocol a given weak cipher was offered under."
required = false
flag = "--cipher-per-proto"

[docker]
network = "bridge"
memory = "1g"
cpus = "1"
pids_limit = 256
# Raised from the default battery's own ~900s budget to accommodate
# each_cipher/cipher_per_proto, which test every locally-known cipher
# suite individually and can meaningfully extend a run.
timeout_seconds = 1500
tmpfs = ["/tmp:rw,noexec,nosuid,nodev,size=64m"]

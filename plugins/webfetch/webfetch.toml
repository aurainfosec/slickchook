name = "webfetch"
container = "slickchook-plugin/webfetch:local"
description = "Fetches one explicitly authorized HTTP(S) URL into the per-run input staging directory for offline analysis. Capped at 100MB (wget's --quota) against a target serving an excessive response - generous enough for any realistic single page, bounded against an unbounded one."
fixed_args = ["-q", "--no-check-certificate", "--timeout=20", "--tries=1", "--quota=100m", "-O", "/input/index.html"]

[[options]]
name = "user_agent"
description = "Override wget's default user-agent string for this fetch, which otherwise identifies itself plainly as wget/<version> on the wire."
required = false
flag = "--user-agent"

[[arguments]]
name = "target"
description = "Authorized HTTP or HTTPS URL to fetch."
required = true
position = 1

[docker]
network = "bridge"
memory = "256m"
cpus = "1"
pids_limit = 64
timeout_seconds = 60
tmpfs = ["/tmp:rw,noexec,nosuid,nodev,size=32m"]
input_read_only = false
